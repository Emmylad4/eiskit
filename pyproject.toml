[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eiskit"
version = "2.0.0"
description = "Equivalent-circuit fitting and DRT analysis of electrochemical impedance spectra"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9", "pandas>=1.5", "matplotlib>=3.6", "openpyxl>=3.0"]

[project.optional-dependencies]
word = ["python-docx>=0.8"]
test = ["pytest"]

[project.scripts]
eiskit = "eiskit.__main__:main"

[tool.setuptools]
packages = ["eiskit"]

[tool.setuptools.package-data]
eiskit = ["app/*.html"]
